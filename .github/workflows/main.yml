name: LazyRDP

on:
  workflow_dispatch:
    inputs:
      theme:
        description: 'Desktop theme for the RDP session'
        required: true
        type: choice
        options:
          - dark
          - light
        default: 'dark'
      app_bundle:
        description: 'Application bundle to install'
        required: true
        type: choice
        options:
          - all       # Chrome, Steam, OBS, Google Drive, Rainmeter + Mond
          - streaming # Chrome, OBS, Rainmeter + Mond
          - minimal   # Chrome only
          - clean     # nothing
        default: 'all'
      wallpaper_url:
        description: '(Optional) Direct image URL (.jpg/.png) for the desktop wallpaper'
        required: false
        default: 'https://4kwallpapers.com/images/wallpapers/gargantua-black-3840x2160-9621.jpg'
      session_hours:
        description: 'Session lifetime in hours (1-6). Shuts down gracefully before the platform cap.'
        required: false
        default: '6'
      storage_boost:
        description: 'Free tens of GB by removing unused preinstalled toolchains (Android, Docker images, Go, Haskell, CodeQL)'
        required: false
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'
      debloat_level:
        description: 'Debloat intensity: light (performance only), standard (bloatware + telemetry), deep (aggressive, vetted for short sessions)'
        required: false
        type: choice
        options:
          - standard
          - light
          - deep
        default: 'standard'

permissions:
  contents: read

concurrency:
  group: rdp-session-${{ github.repository }}
  cancel-in-progress: true

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: '📦 Checkout workflow scripts'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)

      - name: '🛫 Pre-flight validation'
        timeout-minutes: 5
        shell: pwsh
        env:
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          THEME: ${{ inputs.theme }}
          WALLPAPER_URL: ${{ inputs.wallpaper_url }}
          SESSION_HOURS: ${{ inputs.session_hours }}
        run: ./scripts/Pre-Flight.ps1

      - name: '🔐 Configure RDP and session users'
        timeout-minutes: 5
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: ./scripts/New-RdpUsers.ps1

      - name: '🧹 Debloat and optimize Windows'
        timeout-minutes: 10
        shell: pwsh
        env:
          DEBLOAT_LEVEL: ${{ inputs.debloat_level }}
        run: ./scripts/Invoke-Debloat.ps1

      - name: '💾 Storage boost'
        if: ${{ inputs.storage_boost == 'yes' }}
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/Invoke-StorageBoost.ps1

      - name: '🎨 Apply theme and wallpaper'
        timeout-minutes: 5
        shell: pwsh
        env:
          THEME: ${{ inputs.theme }}
        run: ./scripts/Set-Theme.ps1

      - name: '📦 Install application bundle'
        if: ${{ inputs.app_bundle != 'clean' }}
        continue-on-error: true
        timeout-minutes: 20
        shell: pwsh
        env:
          APP_BUNDLE: ${{ inputs.app_bundle }}
        run: ./scripts/Install-Apps.ps1

      - name: '🌐 Connect to Tailscale'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          # An OAuth client owns no user, so its nodes MUST carry a tag
          # defined in the tailnet's Access Controls (tagOwners). Keep this
          # in sync with the watchdog repair in Watch-Session.ps1.
          tags: tag:lazyrdp
          hostname: winrdp-${{ github.run_id }}
          use-cache: 'true'

      - name: '📡 Fetch Tailscale IP'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $tailscaleExe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          $ip = $null
          for ($i = 1; $i -le 20; $i++) {
            $ip = & $tailscaleExe ip -4 2>$null
            if ($ip) { break }
            Write-Host "Waiting for the Tailscale IPv4 address (attempt $i/20)..."
            Start-Sleep -Seconds 5
          }
          if (-not $ip) {
            Write-Host '::error::Failed to obtain the Tailscale IPv4 address. Check that the auth key is valid, ephemeral and reusable.' -ForegroundColor Red
            exit 1
          }
          Add-Content -Path $env:GITHUB_ENV -Value "TAILSCALE_IP=$ip" -Encoding utf8
          Write-Host "Tailscale IPv4: $ip"
          exit 0

      - name: '✨ Publish summary and keep the session alive'
        shell: pwsh
        env:
          APP_BUNDLE: ${{ inputs.app_bundle }}
          THEME: ${{ inputs.theme }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: ./scripts/Watch-Session.ps1
